[project]
name = "heavy-watch-lax"
version = "1.0.0"
description = "Real-time 747/A380 spotter intelligence for KLAX"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
