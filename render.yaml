# Render.com blueprint — single Docker web service + managed Postgres.
# Deploy: push to GitHub, then New > Blueprint and point Render at this repo.
services:
  - type: web
    name: heavy-watch-lax
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HWL_DATABASE_URL
        fromDatabase:
          name: hwl-db
          property: connectionString
      - key: HWL_UPLOADS_DIR
        value: /data/uploads
      - key: HWL_USER_AGENT
        value: HeavyWatchLAX/1.0 (render)
    disk:
      name: hwl-uploads
      mountPath: /data
      sizeGB: 1

databases:
  - name: hwl-db
    plan: free
    databaseName: heavywatch
